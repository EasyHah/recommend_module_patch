<!DOCTYPE html>
<html>
<head>
    <title>语音播报功能测试</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>语音播报功能测试</h1>
    <button onclick="testTTS()">测试语音播报</button>
    <button onclick="testQueue()">测试语音队列</button>
    <button onclick="stopTTS()">停止播报</button>
    <div id="log"></div>

    <script>
        function log(message) {
            document.getElementById('log').innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        function testTTS() {
            log('[测试] 开始测试语音播报');
            
            try {
                if (typeof window !== 'undefined' && window.speechSynthesis) {
                    log('[测试] SpeechSynthesis API 可用');
                    
                    const synth = window.speechSynthesis;
                    synth.cancel(); // 清理旧的
                    
                    const utter = new SpeechSynthesisUtterance('你好，这是一个语音播报测试');
                    utter.lang = 'zh-CN';
                    utter.rate = 0.9;
                    utter.pitch = 1.0;
                    utter.volume = 0.8;
                    
                    utter.onstart = () => log('[测试] 语音开始播放');
                    utter.onend = () => log('[测试] 语音播放结束');
                    utter.onerror = (e) => log('[测试] 语音播放错误: ' + e.error);
                    
                    synth.speak(utter);
                    log('[测试] 语音已提交给浏览器');
                } else {
                    log('[错误] SpeechSynthesis API 不可用');
                }
            } catch (error) {
                log('[错误] ' + error.message);
            }
        }

        function testQueue() {
            log('[测试] 测试语音队列');
            
            const messages = [
                '这是第一条消息',
                '这是第二条消息', 
                '这是第三条消息'
            ];

            messages.forEach((msg, index) => {
                setTimeout(() => {
                    log(`[队列] 播报第${index + 1}条消息`);
                    speak(msg);
                }, index * 1000);
            });
        }

        function speak(text) {
            if (!text) return;
            
            try {
                const synth = window.speechSynthesis;
                if (!synth) return;
                
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-CN';
                utter.rate = 0.9;
                utter.pitch = 1.0;
                utter.volume = 0.8;
                
                utter.onstart = () => log(`[播报] 开始: ${text.slice(0, 20)}...`);
                utter.onend = () => log(`[播报] 结束: ${text.slice(0, 20)}...`);
                utter.onerror = (e) => log(`[播报] 错误: ${e.error}`);
                
                synth.speak(utter);
            } catch (error) {
                log('[播报错误] ' + error.message);
            }
        }

        function stopTTS() {
            try {
                window.speechSynthesis.cancel();
                log('[测试] 已停止所有语音播报');
            } catch (error) {
                log('[错误] 停止播报失败: ' + error.message);
            }
        }
    </script>
</body>
</html>
