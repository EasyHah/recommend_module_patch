<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#0D47A1" stroke-width="1"/>
  
  <!-- 麦克风图标 -->
  <g transform="translate(16,16)">
    <!-- 麦克风主体 -->
    <rect x="-2.5" y="-7" width="5" height="8" rx="2.5" fill="white"/>
    
    <!-- 麦克风网格效果 -->
    <line x1="-1.5" y1="-5" x2="1.5" y2="-5" stroke="#1E88E5" stroke-width="0.5"/>
    <line x1="-1.5" y1="-3" x2="1.5" y2="-3" stroke="#1E88E5" stroke-width="0.5"/>
    <line x1="-1.5" y1="-1" x2="1.5" y2="-1" stroke="#1E88E5" stroke-width="0.5"/>
    
    <!-- 麦克风底座弧线 -->
    <path d="M -5 1 Q -5 6 0 6 Q 5 6 5 1" stroke="white" stroke-width="1.2" fill="none"/>
    
    <!-- 麦克风支架 -->
    <line x1="0" y1="6" x2="0" y2="9" stroke="white" stroke-width="1.2"/>
    
    <!-- 底座 -->
    <line x1="-3" y1="9" x2="3" y2="9" stroke="white" stroke-width="1.2"/>
    
    <!-- 声波效果 -->
    <path d="M -8 -3 Q -8 -6 -5 -6 Q -2 -6 -2 -3 Q -2 0 -5 0 Q -8 0 -8 -3" 
          fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <path d="M 8 -3 Q 8 -6 5 -6 Q 2 -6 2 -3 Q 2 0 5 0 Q 8 0 8 -3" 
          fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
</svg>